<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: sans-serif;
        }
        p{
            color: red;
        }
        .highlight{
            background-color: pink;
        }
        #unique{
            color: green;
            background-color: brown;
        }
        button{
            /* padding : top-bottom left-right; */
            padding: 8px 16px;
            border-radius: 4px;
        }
        .primary-btn{
            background-color: midnightblue;
            color: wheat;
        }

    </style>
</head>
<body>
    <section>
        <h2>Hello world</h2>
        <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Modi, quae.</p>
        <p class="highlight">Highlight element</p>
        <p id="unique">Unique Element</p>
        <button>Click Me</button>
        <button class="primary-btn">Primary button</button>
    </section>
</body>
</html>
